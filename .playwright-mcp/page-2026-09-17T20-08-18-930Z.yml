    - paragraph [ref=f2e224]:
      - strong [ref=f2e225]: goal_all y goal son indistinguibles frente a la pregunta francesa.
      - text: "En la capa 14 están en 0.709 y 0.752, con un techo de 0.987: del hueco de 0.28 hasta 1.0, solo 0.013 puede ser ruido de muestreo. El resto es diferencia representacional real."
      - strong [ref=f2e226]: header queda por debajo en toda la banda
      - text: "y nunca cierra: 0.521 en la capa 14 contra 0.709 de goal_all, y sigue 0.15 abajo en la capa 28. El piso genérico,"
      - code [ref=f2e227]: goal_all ~ «Answer this in one short sentence.»
      - text: ", se queda en 0.25 a 0.41: es el coseno que da cualquier cosa que empuje al modelo a responder distinto, sin francés de por medio. Las tres series lo superan cómodamente, así que la alineación con el francés no es solo «más que una dirección al azar». La línea rosa es el control que decide si la pregunta vale: las dos referencias empiezan lejos (0.46 en la capa 12) y recién convergen a 0.91 en la 28. Arriba de la capa 20 preguntar a cuál se parece el parche ya no tiene respuesta, porque las dos referencias son casi la misma cosa."
