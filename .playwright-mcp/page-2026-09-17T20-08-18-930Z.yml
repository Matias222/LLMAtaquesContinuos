    - paragraph [ref=f2e161]:
      - strong [ref=f2e162]: Desde la capa 12 las tres van por la misma curva.
      - text: "En la 12 miden 6.10, 6.40 y 4.76; en la 20, 11.10, 10.84 y 10.89; en la 28, 72.1, 71.7 y 70.5. Ninguno de los dos parches empuja más ni menos que una pregunta francesa de verdad: aterrizan en su misma magnitud."
      - strong [ref=f2e163]: Donde se separan es abajo.
      - text: "En la capa 4 goal_all mide 2.58 contra 1.26 de la pregunta francesa, el doble, que es lo esperable de sumar el mismo vector en diez o veinte posiciones en vez de tres. El parche de tres posiciones hace lo contrario: arranca por encima en la capa 1 y se queda corto entre la 6 y la 14. Las dos anomalías se apagan en la misma zona, capas 10 a 14, que es donde las cabezas leen el parche. header es el único que no converge: queda entre 7 % y 30 % por encima de la pregunta francesa en toda la banda, con una norma de parche que es la más chica de las tres."
