      - text: "Su línea llena va por encima de la punteada desde la capa 1 hasta la 16, con la mayor distancia abajo de todo: +0.37 en la capa 1, +0.28 en la 5, +0.18 en la 12. En la capa 16 se cruzan y a partir de ahí las dos referencias ya son casi la misma cosa, así que el cruce no significa que cambie de ruta."
